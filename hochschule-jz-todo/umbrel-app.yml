manifestVersion: 1
id: hochschule-jz-todo
name: To Do
tagline: A calm, modern task manager
icon: https://raw.githubusercontent.com/hochschule-jz/umbrel-app-store/main/hochschule-jz-todo/icon.png
category: Productivity
version: "2.0.3"
port: 8742
description: >-
  To Do is a self-hosted, single-user task manager with a calm "matcha" theme.


  Organise tasks into lists and groups, flag what's important, plan your day,
  add steps, notes, reminders and due dates. All data is stored in a dedicated
  PostgreSQL database on your Umbrel, and the app installs as a PWA on iOS,
  Android, macOS and Windows over your private Tailscale network.
developer: Julian Zankl
website: https://github.com/hochschule-jz/todo
submitter: Julian Zankl
submission: https://github.com/hochschule-jz/todo
repo: https://github.com/hochschule-jz/todo
support: https://github.com/hochschule-jz/todo/issues
gallery:
  - https://raw.githubusercontent.com/hochschule-jz/umbrel-app-store/main/hochschule-jz-todo/icon.png
releaseNotes: >-
  2.0.3 tidies up after the first days: the toolbar no longer squeezes its
  labels together beside the task details, categories open as a sheet on the
  phone, the task completed last comes first, and empty suggestions say so.


  Version 2 is a rebuild that looks and works like Microsoft To Do: like the
  web app on the desktop and like the iOS app on the phone, with colour
  schemes and three densities to choose from.


  • Smart lists, groups, steps, reminders, repeats, categories, files and your
  own background images.


  • Live sync between devices and offline use.


  • Smoother motion when you complete, open and swipe tasks.


  Your v1 data is converted automatically on the first start. Take a backup
  first (see the release notes on GitHub), because going back to v1 means
  restoring that backup.

