releaseNotes: >-
  Neu in dieser Version:


  - Einstellungen › Siri-Kurzbefehl sagt jetzt dazu: Der Kurzbefehl muss genau „Einkaufszettel“ heißen. Lösch vorher einen älteren mit diesem Namen, sonst heißt der neue „Einkaufszettel 2“ und Siri findet ihn nicht.

  - „Kurzbefehl laden“ funktioniert jetzt in Safari: Die Datei heißt „Einkaufszettel.shortcut“ und öffnet sich in „Kurzbefehle“. Bisher wurde sie als „.shortcut.html“ gespeichert.

  - Siri versteht jetzt, was du sagst: „Milch Eier und zwei Liter Hafermilch“ werden drei Artikel, die Menge steht in der Notiz. Siri sagt dir danach, was auf der Liste steht.

  - Den Kurzbefehl gibt es fertig: unter Einstellungen › Siri-Kurzbefehl die Adresse kopieren, „Kurzbefehl laden“ antippen und die Adresse einfügen. Er heißt „Einkaufszettel“. Dein alter Kurzbefehl funktioniert weiter.

  - „Foto hinzufügen“ öffnet die Auswahl deines Geräts: Fotomediathek, Kamera oder Dateien. Die eigene Kamera der App gibt es nicht mehr.
