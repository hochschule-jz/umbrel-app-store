manifestVersion: 1
id: hochschule-jz-einkaufsliste
category: files
name: Einkaufsliste
version: "0.1.19"
tagline: Die gemeinsame Einkaufsliste für euren Haushalt
description: >-
  Eine Einkaufsliste für einen Haushalt: Artikel als Kacheln antippen, im Geschäft abhaken,
  alle Listen werden geteilt und sofort auf allen Geräten aktualisiert.


  Am iPhone über „Teilen“ zum Home-Bildschirm hinzufügen. Beim ersten Start legst du das erste
  Konto an; weitere Mitglieder fügst du in den Einstellungen hinzu. Artikel lassen sich auch
  per Siri-Kurzbefehl diktieren.
developer: Privat
website: https://github.com/hochschule-jz/umbrel-app-store
dependencies: []
repo: https://github.com/hochschule-jz/umbrel-app-store
support: https://github.com/hochschule-jz/umbrel-app-store/issues
# The address is http://umbrel.local:8642 (or your Tailscale name). Change it if another app uses this port.
port: 8642
icon: https://raw.githubusercontent.com/hochschule-jz/umbrel-app-store/main/hochschule-jz-einkaufsliste/icon.png
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Neu in dieser Version:


  - Die Artikeldetails sind niedriger: Sie nehmen höchstens 60 % des Bildschirms ein, damit du den Griff oben leichter erreichst und sie nach unten wegziehen kannst.

  - Kategorie und „Verschieben nach“ findest du, wenn du in den Details ein Stück nach unten scrollst.
submitter: Privat
